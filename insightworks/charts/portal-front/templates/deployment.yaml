apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-front
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: portal-front
  template:
    metadata:
      labels:
        app: portal-front
    spec:
      {{- $pullSecret := .Values.image.pullSecret | default .Values.global.imagePullSecret.name }}
      {{- if $pullSecret }}
      imagePullSecrets:
        - name: {{ $pullSecret }}
      {{- end }}
      containers:
        - name: portal-front
          image: "{{ .Values.image.repository }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}   # Next.js actual port
